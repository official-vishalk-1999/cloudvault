<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Signup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="col-md-4 offset-md-4">
        <div class="card p-4 shadow">
            <h4 class="text-center mb-3">Signup</h4>

            <input type="text" id="name" class="form-control mb-2" placeholder="Name">
            <input type="email" id="email" class="form-control mb-2" placeholder="Email">
            <input type="password" id="password" class="form-control mb-3" placeholder="Password">

            <button class="btn btn-success w-100 mb-2" onclick="signup()">Signup</button>

            <button class="btn btn-outline-primary w-100 mb-2" onclick="goLogin()">Login</button>

            <button class="btn btn-secondary w-100" onclick="goHome()">Back to Home</button>
        </div>
    </div>
</div>

<script>

    function signup() {

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();

        // EMPTY CHECK
        if (!name || !email || !password) {
            alert("All fields are required");
            return;
        }

        // NAME VALIDATION (NO SPECIAL CHARACTERS)
        const nameRegex = /^[A-Za-z ]+$/;
        if (!nameRegex.test(name)) {
            alert("Name should not contain special characters");
            return;
        }

        // EMAIL VALIDATION
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
            alert("Enter a valid email (e.g. abc@gmail.com)");
            return;
        }

        const data = {
            email: email,
            name: name,
            password: password
        };

        fetch("/api/auth/signup", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(data)
        })
            .then(res => res.text())
            .then(msg => {

                alert(msg);

                if (msg === "Signup successful") {
                    window.location.href = "login.html";
                }
            })
            .catch(() => {
                alert("Something went wrong");
            });
    }

    function goLogin() {
        window.location.href = "login.html";
    }

    function goHome() {
        window.location.href = "index.html";
    }

</script>

</body>
</html>
