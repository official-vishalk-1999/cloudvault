<!DOCTYPE html>
<html>
<head>
  <title>CloudVault - Sign up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width:400px;margin-top:90px">
  <h3 class="text-center mb-4">CloudVault</h3>
  <form class="card p-4" onsubmit="signup(event)">
    <input id="name" class="form-control mb-2" placeholder="Name" required>
    <input id="email" type="email" class="form-control mb-2" placeholder="Email" required>
    <input id="password" type="password" class="form-control mb-3" placeholder="Password" required>
    <button class="btn btn-primary w-100 mb-2">Sign up</button>
    <a href="index.html" class="text-center small">Back to login</a>
  </form>
</div>
<script>
const v = id => document.getElementById(id).value;
function signup(e) {
  e.preventDefault();
  fetch('/api/auth/signup', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name:v('name'), email:v('email'), password:v('password')})})
    .then(r => r.text()).then(t => { alert(t); if (t === 'Signup successful') location.href = 'index.html'; });
}
</script>
</body>
</html>
