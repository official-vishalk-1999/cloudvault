<!DOCTYPE html>
<html>
<head>
  <title>CloudVault - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width:400px;margin-top:90px">
  <h3 class="text-center mb-4">CloudVault</h3>
  <form class="card p-4" onsubmit="login(event)">
    <input id="email" type="email" class="form-control mb-2" placeholder="Email" required>
    <input id="password" type="password" class="form-control mb-3" placeholder="Password" required>
    <button class="btn btn-primary w-100 mb-2">Log in</button>
    <a href="signup.html" class="text-center small">Create an account</a>
  </form>
</div>
<script>
const v = id => document.getElementById(id).value;
function login(e) {
  e.preventDefault();
  fetch('/api/auth/login', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({email:v('email'), password:v('password')})})
    .then(r => r.text()).then(t => {
      if (t === 'Login successful') { sessionStorage.setItem('user', v('email')); location.href = 'vault.html'; }
      else alert(t);
    });
}
</script>
</body>
</html>
