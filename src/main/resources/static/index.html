<!DOCTYPE html>
<html>
<head>
    <title>CloudVault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta charset="UTF-8">
</head>

<body class="bg-light">

<div class="container mt-5 text-center">
    <h2 class="mb-5">CloudVault</h2>

    <div class="row justify-content-center">

        <!-- USER -->
        <div class="col-md-4">
            <div class="card p-4 shadow">
                <h4>User</h4>
                <button class="btn btn-primary w-100" onclick="goUser()">User Login</button>
            </div>
        </div>

        <!-- ADMIN -->
        <div class="col-md-4">
            <div class="card p-4 shadow">
                <h4>Admin</h4>
                <button class="btn btn-dark w-100" onclick="goAdmin()">Admin Login</button>
            </div>
        </div>

    </div>
</div>

<script>
    function goUser() {
        window.location.href = "login.html";
    }

    function goAdmin() {
        window.location.href = "admin-login.html";
    }
</script>

</body>
</html>
