<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<script>
    // SESSION CHECK
    if (!sessionStorage.getItem("user") && !sessionStorage.getItem("loggedIn")) {
        window.location.replace("login.html");
    }
</script>

<div class="container mt-4">

    <div class="d-flex justify-content-between mb-3">
        <h3>CloudVault</h3>
        <button class="btn btn-danger" onclick="logout()">Logout</button>
    </div>

    <!-- Upload Section -->
    <div class="card p-3 mb-3">

        <!-- INFO TEXT -->
        <p class="text-muted mb-2">
            Allowed: JPG, JPEG, PNG | Max Size: 1MB
        </p>

        <input type="file" id="fileInput" class="form-control mb-2">
        <button class="btn btn-primary" onclick="upload()">Upload</button>
    </div>

    <!-- Files -->
    <div class="card p-3">
        <h5>Your Files</h5>
        <div id="fileList" class="row"></div>
    </div>

</div>

<script>

    const user = sessionStorage.getItem("user");

    // UPLOAD
    function upload() {

        const fileInput = document.getElementById("fileInput");
        const file = fileInput.files[0];

        if (!file) {
            alert("Select file");
            return;
        }

        // TYPE VALIDATION
        const allowedTypes = ["image/jpeg", "image/png", "image/jpg"];
        if (!allowedTypes.includes(file.type)) {
            alert("Only JPG, JPEG, PNG allowed");
            fileInput.value = "";
            return;
        }

        // SIZE VALIDATION (1MB)
        const maxSize = 1 * 1024 * 1024;
        if (file.size > maxSize) {
            alert("File size should be less than 1MB");
            fileInput.value = "";
            return;
        }

        const formData = new FormData();
        formData.append("file", file);
        formData.append("userId", user);

        fetch("/api/files/upload", {
            method: "POST",
            body: formData
        })
            .then(res => res.text())
            .then(msg => {
                alert("Upload successful");
                fileInput.value = "";
                loadFiles();
            });
    }

    // LOAD FILES
    function loadFiles() {

        fetch(`/api/files/${user}`)
            .then(res => res.json())
            .then(data => {

                const container = document.getElementById("fileList");
                container.innerHTML = "";

                data.forEach(file => {

                    container.innerHTML += `
                    <div class="col-md-3 mb-3">
                        <div class="card p-2">

                            <img src="${file.fileUrl}" class="img-fluid mb-2">

                            <p>${file.imageId}</p>

                            <a href="${file.fileUrl}" download class="btn btn-success btn-sm mb-1">
                                Download
                            </a>

                            <button class="btn btn-danger btn-sm"
                                onclick="deleteFile('${file.imageId}')">
                                Delete
                            </button>

                        </div>
                    </div>
                `;
                });
            });
    }

    // DELETE
    function deleteFile(fileName) {

        const confirmDelete = confirm("Are you sure you want to delete this file?");
        if (!confirmDelete) return;

        fetch(`/api/files/delete?fileName=${fileName}&userId=${user}`, {
            method: "DELETE"
        })
            .then(() => {
                alert("File deleted successfully");
                loadFiles();
            });
    }

    // LOGOUT
    function logout() {
        sessionStorage.clear();
        window.location.replace("login.html");
    }

    loadFiles();

</script>

</body>
</html>
