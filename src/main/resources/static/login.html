<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="col-md-4 offset-md-4">
        <div class="card p-4 shadow">
            <h4 class="text-center mb-3">Login</h4>

            <input type="email" id="email" class="form-control mb-2" placeholder="Email">
            <input type="password" id="password" class="form-control mb-3" placeholder="Password">

            <button class="btn btn-primary w-100 mb-2" onclick="login()">Login</button>

            <button class="btn btn-outline-success w-100 mb-2" onclick="goSignup()">Signup</button>

            <button class="btn btn-secondary w-100" onclick="goHome()">Back to Home</button>
        </div>
    </div>
</div>

<script>

    function login() {

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();

        fetch("/api/auth/login", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ email, password })
        })
            .then(res => res.text())
            .then(msg => {

                console.log("LOGIN:", msg);

                if (msg !== "Login successful") {
                    alert(msg);
                    return;
                }

                sessionStorage.setItem("user", email);
                sessionStorage.setItem("loggedIn", "true");

                window.location.replace("dashboard.html");
            });
    }

    function goSignup() {
        window.location.href = "signup.html";
    }

    function goHome() {
        window.location.href = "index.html";
    }

</script>

</body>
</html>
