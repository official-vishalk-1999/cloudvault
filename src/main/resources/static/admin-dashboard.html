<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between mb-4">
        <h3>Admin Dashboard</h3>
        <button class="btn btn-danger" onclick="logout()">Logout</button>
    </div>

    <div class="card p-3">
        <h5>Users & Image Count</h5>

        <table class="table mt-3">
            <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Images</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="userTable"></tbody>
        </table>
    </div>

</div>

<script>

    // BLOCK UNAUTHORIZED ADMIN ACCESS
    if (!sessionStorage.getItem("admin")) {
        window.location.replace("admin-login.html");
    }

    // PREVENT BACK BUTTON
    window.history.pushState(null, null, window.location.href);
    window.onpopstate = function () {
        window.location.replace("admin-login.html");
    };

    function loadUsers() {

        fetch("/api/admin/users")
            .then(res => res.json())
            .then(data => {

                const table = document.getElementById("userTable");
                table.innerHTML = "";

                if (data.length === 0) {
                    table.innerHTML = "<tr><td colspan='5'>No data found</td></tr>";
                    return;
                }

                data.forEach(user => {

                    const statusBtn = user.enabled === "true"
                        ? `<button class="btn btn-warning btn-sm"
                        onclick="toggleUser('${user.email}','false')">Disable</button>`
                        : `<button class="btn btn-success btn-sm"
                        onclick="toggleUser('${user.email}','true')">Enable</button>`;

                    table.innerHTML += `
                    <tr>
                        <td>${user.name}</td>
                        <td>${user.email}</td>
                        <td>${user.imageCount}</td>
                        <td>${user.enabled}</td>
                        <td>
                            ${statusBtn}
                            <button class="btn btn-danger btn-sm"
                                onclick="deleteUser('${user.email}')">
                                Delete
                            </button>
                        </td>
                    </tr>
                `;
                });
            });
    }

    function deleteUser(email) {

        if (!confirm("Delete user?")) return;

        fetch(`/api/admin/delete?email=${email}`, {
            method: "DELETE"
        })
            .then(() => {
                alert("User deleted");
                loadUsers();
            });
    }

    function toggleUser(email, status) {

        fetch(`/api/admin/toggle?email=${email}&enabled=${status}`, {
            method: "POST"
        })
            .then(() => {
                alert("Status updated");
                loadUsers();
            });
    }

    function logout() {
        sessionStorage.clear();
        window.location.replace("admin-login.html");
    }

    loadUsers();

</script>

</body>
</html>
