<!DOCTYPE html>
<html>
<head>
  <title>CloudVault - Vault</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width:520px;margin-top:50px">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="mb-0">My Vault</h3>
    <button class="btn btn-sm btn-outline-secondary" onclick="logout()">Log out</button>
  </div>
  <form onsubmit="upload(event)" class="mb-3">
    <input id="file" type="file" accept=".jpg,.jpeg,.png" class="form-control mb-1" required>
    <small class="text-muted d-block mb-2">JPG, JPEG or PNG only, up to 10 MB.</small>
    <button class="btn btn-success w-100">Upload</button>
  </form>
  <div id="gallery" class="row g-2"></div>
</div>
<script>
const user = sessionStorage.getItem('user');
if (!user) location.href = 'index.html';
function upload(e) {
  e.preventDefault();
  const data = new FormData();
  data.append('file', document.getElementById('file').files[0]);
  data.append('userId', user);
  fetch('/api/files/upload', {method:'POST', body:data})
    .then(r => r.text()).then(t => { if (t !== 'Upload successful') alert(t); list(); });
}
function list() {
  fetch('/api/files/' + user).then(r => r.json()).then(files =>
    document.getElementById('gallery').innerHTML = files.map(f =>
      `<div class="col-4"><img src="${f.url}" class="img-fluid rounded border"></div>`).join(''));
}
function logout() { sessionStorage.removeItem('user'); location.href = 'index.html'; }
if (user) list();
</script>
</body>
</html>
